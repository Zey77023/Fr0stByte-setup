<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

    <!-- Sans-serif fallback chain -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>Noto Sans</family>
            <family>Roboto</family>
            <family>Open Sans</family>
            <family>Cantarell</family>
            <family>Liberation Sans</family>
            <family>DejaVu Sans</family>
            <family>Noto Sans CJK JP</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans CJK TC</family>
            <family>Noto Sans CJK HK</family>
            <family>Noto Sans CJK KR</family>
            <family>Noto Color Emoji</family>
            <family>Noto Emoji</family>
        </prefer>
    </alias>

    <!-- Serif fallback chain -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>Noto Serif</family>
            <family>Liberation Serif</family>
            <family>DejaVu Serif</family>
            <family>Noto Serif CJK JP</family>
            <family>Noto Serif CJK SC</family>
            <family>Noto Serif CJK TC</family>
            <family>Noto Serif CJK HK</family>
            <family>Noto Serif CJK KR</family>
            <family>Noto Color Emoji</family>
            <family>Noto Emoji</family>
        </prefer>
    </alias>

    <!-- Monospace fallback chain -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>Noto Sans Mono</family>
            <family>MesloLGS NF</family>
            <family>Liberation Mono</family>
            <family>DejaVu Sans Mono</family>
            <family>Noto Sans CJK JP</family>
            <family>Noto Sans CJK SC</family>
            <family>Noto Sans CJK KR</family>
            <family>Symbola</family>
            <family>Noto Color Emoji</family>
            <family>Noto Emoji</family>
        </prefer>
    </alias>

    <!-- Rendering & LCD subpixel anti-aliasing optimizations -->
    <match target="font">
        <edit name="antialias" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hinting" mode="assign">
            <bool>true</bool>
        </edit>
        <edit name="hintstyle" mode="assign">
            <const>hintslight</const>
        </edit>
        <edit name="rgba" mode="assign">
            <const>rgb</const>
        </edit>
        <edit name="lcdfilter" mode="assign">
            <const>lcddefault</const>
        </edit>
    </match>

    <!-- Map standard proprietary fonts to installed open alternatives -->
    <alias>
        <family>Arial</family>
        <prefer><family>Liberation Sans</family></prefer>
    </alias>
    <alias>
        <family>Helvetica</family>
        <prefer><family>Liberation Sans</family></prefer>
    </alias>
    <alias>
        <family>Times New Roman</family>
        <prefer><family>Liberation Serif</family></prefer>
    </alias>
    <alias>
        <family>Courier New</family>
        <prefer><family>Liberation Mono</family></prefer>
    </alias>

</fontconfig>
